# nginx.conf
# Note: DATAGOVSG_API_KEY is injected at container startup via envsubst.
# See frontend/Dockerfile for how this template is processed.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Serve React app - all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy real-time environment data (PSI, PM2.5, etc.)
    # Upstream: https://api-open.data.gov.sg/v2/real-time/api/
    # Usage:    /api/env/psi  -->  .../psi
    #           /api/env/pm25 -->  .../pm25
    location /api/env/ {
        proxy_pass https://api-open.data.gov.sg/v2/real-time/api/;
        proxy_set_header Host             api-open.data.gov.sg;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header Accept           application/json;
        proxy_set_header X-Api-Key        ${DATAGOVSG_API_KEY};
        proxy_ssl_server_name             on;
        proxy_ssl_protocols               TLSv1.2 TLSv1.3;
        proxy_connect_timeout             10s;
        proxy_read_timeout                15s;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }

    # Proxy weather/collection data
    # Upstream: https://api-production.data.gov.sg/v2/public/api/collections/
    location /api/weather/ {
        proxy_pass https://api-production.data.gov.sg/v2/public/api/collections/;
        proxy_set_header Host             api-production.data.gov.sg;
        proxy_set_header Accept           application/json;
        proxy_ssl_server_name             on;
        proxy_ssl_protocols               TLSv1.2 TLSv1.3;
        proxy_connect_timeout             10s;
        proxy_read_timeout                15s;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"    always;

    # Gzip compression
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}